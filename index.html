<!doctype html>
<html lang="en" data-reduce-motion="false">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05060B" />
    <meta name="description" content="A self-development system. Log the work, get judged on it, level up." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>THE SYSTEM</title>
    <style>
      /* Painted before the bundle lands, so the first frame is never white. */
      html, body { margin: 0; background: #05060B; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: #05060B; z-index: 9999;
      }
      #boot span {
        font-family: ui-monospace, monospace; font-size: 10px;
        letter-spacing: .42em; color: #3EC6FF; text-transform: uppercase;
        animation: bootpulse 1.5s ease-in-out infinite;
      }
      @keyframes bootpulse { 0%,100%{opacity:.35} 50%{opacity:1} }
    </style>
  </head>
  <body>
    <div id="boot"><span>System initialising</span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
